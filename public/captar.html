<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fale connosco</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body { background: var(--fundo); }
  .caixa { max-width: 440px; margin: 6vh auto; padding: 0 20px; }
  .caixa .cartao { padding: 24px; }
  .feito { text-align: center; padding: 30px 10px; }
  .feito .tique {
    width: 56px; height: 56px; border-radius: 50%; background: var(--verde-fundo);
    color: var(--verde); display: grid; place-items: center; font-size: 1.8rem;
    margin: 0 auto 14px;
  }
</style>
</head>
<body>
<div class="caixa">
  <div class="cartao" id="cartao">
    <h1 id="titulo">Fale connosco</h1>
    <p class="nota-rodape" style="margin:4px 0 20px" id="subtitulo">
      Deixe o contacto e respondemos em minutos.
    </p>

    <form id="form">
      <label class="campo"><span>Nome</span>
        <input name="nome" required autocomplete="name"></label>
      <label class="campo"><span>Telemóvel</span>
        <input name="telefone" inputmode="tel" required placeholder="912 345 678" autocomplete="tel"></label>
      <label class="campo"><span>Email (opcional)</span>
        <input name="email" type="email" autocomplete="email"></label>
      <label class="campo"><span>O que procura?</span>
        <textarea name="mensagem" placeholder="Ex.: procuro T3 em Matosinhos até 350.000 €, com crédito já aprovado, para mudar até ao fim do ano."></textarea></label>

      <label style="display:flex;gap:10px;align-items:start;margin-bottom:16px;font-size:.86rem;color:var(--tinta-suave)">
        <input type="checkbox" required style="margin-top:3px">
        <span>Autorizo o tratamento dos meus dados para ser contactado sobre este pedido.</span>
      </label>

      <button class="botao principal" style="width:100%">Enviar</button>
      <p class="nota-rodape" id="erro" role="alert"></p>
    </form>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
// Permite personalizar por campanha: ?titulo=...&imovel=...&ref=...
if (params.get('titulo')) document.getElementById('titulo').textContent = params.get('titulo');
if (params.get('subtitulo')) document.getElementById('subtitulo').textContent = params.get('subtitulo');

document.getElementById('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const botao = ev.target.querySelector('button');
  botao.disabled = true;
  botao.textContent = 'A enviar…';

  const d = Object.fromEntries(new FormData(ev.target));
  try {
    const r = await fetch('/api/leads', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        ...d,
        origem: params.get('origem') || 'formulario',
        portal: 'proprio',
        imovel_ref: params.get('ref') || undefined,
        imovel_titulo: params.get('imovel') || undefined,
      }),
    });
    if (!r.ok) throw new Error((await r.json()).erro || 'Falhou');
    document.getElementById('cartao').innerHTML =
      '<div class="feito"><div class="tique">✓</div>' +
      '<h1>Recebido</h1>' +
      '<p class="nota-rodape">Vai ser contactado dentro de momentos.</p></div>';
  } catch (e) {
    document.getElementById('erro').textContent = e.message;
    botao.disabled = false;
    botao.textContent = 'Enviar';
  }
});
</script>
</body>
</html>
